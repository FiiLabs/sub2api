# Build + publish the two images the sub2api Phala CVM runs, with SLSA
# provenance and keyless cosign signatures, so a verifier can prove each pinned
# digest was built by THIS repo's CI from a specific commit (digest <-> source
# binding). See docs/attestation-verification.md §4.
#
#   sub2api          - the whole service (Go backend + embedded frontend),
#                      built from the repo-root Dockerfile
#   sub2api-attestor - the attestation sidecar (deploy/attestor/), serves the
#                      nonce-bound TDX quote the /proof page verifies
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  - a Docker Hub user with push access to docker.io/markerdao
#   DOCKERHUB_TOKEN     - that user's access token
# Keyless cosign signing uses GitHub OIDC (no long-lived keys) — needs id-token: write.
#
# After a run: the printed digest is the multi-arch INDEX (what cosign signs).
# Pin the linux/amd64 CHILD manifest into deploy/phala/docker-compose.yml
# (get it with `docker buildx imagetools inspect <image>@<index-digest>`),
# then update docs/attestation-verification.md and deploy/phala/reference.json.

name: publish-tee-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. proof-v1)"
        required: true
        default: "manual"

permissions:
  contents: read
  id-token: write        # keyless cosign (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sub2api
            image: docker.io/markerdao/sub2api
            context: .
            build-args: |
              VERSION=${{ inputs.tag }}
              COMMIT=${{ github.sha }}
              GOPROXY=https://proxy.golang.org,direct
              GOSUMDB=sum.golang.org
          - name: sub2api-attestor
            image: docker.io/markerdao/sub2api-attestor
            context: deploy/attestor
            build-args: ""
    name: build-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build + push. provenance=mode=max attaches a SLSA provenance attestation
      # (builder + source) to the image; sbom=true attaches an SBOM. Both are
      # stored in the registry alongside the image and are independently verifiable.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:${{ inputs.tag }}
          build-args: ${{ matrix.build-args }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signature over the exact digest (identity = this workflow's OIDC).
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Print pinned reference
        run: |
          echo "::notice::${{ matrix.image }}@${{ steps.build.outputs.digest }} (INDEX digest — cosign target)"
          echo "Pin the linux/amd64 child manifest in deploy/phala/docker-compose.yml:"
          docker buildx imagetools inspect "${{ matrix.image }}@${{ steps.build.outputs.digest }}" | sed -n '1,20p'

# Verify (any third party):
#   cosign verify-attestation --type slsaprovenance \
#     --certificate-identity-regexp 'https://github.com/FiiLabs/sub2api/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     docker.io/markerdao/sub2api@sha256:<index-digest>
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/FiiLabs/sub2api/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     docker.io/markerdao/sub2api@sha256:<index-digest>
