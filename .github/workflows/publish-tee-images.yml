# Build + publish the two markerdao TEE helper images with SLSA provenance and
# keyless cosign signatures, so a verifier can prove each pinned digest was built
# by THIS repo's CI from a specific commit (digest <-> source binding). See
# docs/attestation-verification.md §4.
#
# The gateway itself is NOT built here — it is built in-TEE by git-launcher from
# the pinned commit, so the commit is its provenance.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  - a Docker Hub user with push access to docker.io/markerdao
#   DOCKERHUB_TOKEN     - that user's access token
# Keyless cosign signing uses GitHub OIDC (no long-lived keys) — needs id-token: write.
#
# After a run, copy the printed digest into the compose files
# (deploy/gateway/compose.enclave.yaml, deploy/meridian/compose.seats.generated.yaml
# via gen-seats.sh IMAGE) and re-verify the deployment's compose_hash.

name: publish-tee-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v2, 1.44.1)"
        required: true
        default: "manual"

permissions:
  contents: read
  id-token: write        # keyless cosign (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: meridian-enclave
            image: docker.io/markerdao/meridian-enclave
            context: deploy/meridian
            prebuild: deploy/meridian/fetch-gost.sh   # fetch gost into the build context
          - name: git-launcher-rust
            image: docker.io/markerdao/git-launcher-rust
            context: deploy/gateway/launcher
            prebuild: ""
          - name: meridian-attestor
            image: docker.io/markerdao/meridian-attestor
            context: deploy/meridian/attestor
            prebuild: ""
    name: build-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prebuild step (fetch build-context assets)
        if: matrix.prebuild != ''
        run: bash "${{ matrix.prebuild }}"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build + push. provenance=mode=max attaches a SLSA provenance attestation
      # (builder + source) to the image; sbom=true attaches an SBOM. Both are
      # stored in the registry alongside the image and are independently verifiable.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:${{ inputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signature over the exact digest (identity = this workflow's OIDC).
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Print pinned reference
        run: |
          echo "::notice::${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          echo "Pin this digest in the compose and update docs/attestation-verification.md."

# Verify (any third party):
#   cosign verify-attestation --type slsaprovenance \
#     --certificate-identity-regexp 'https://github.com/FiiLabs/sub2api/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     docker.io/markerdao/meridian-enclave@sha256:<digest>
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/FiiLabs/sub2api/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     docker.io/markerdao/meridian-enclave@sha256:<digest>
