# =============================================================================
# Sub2API — Phala CVM compose (single-service proof architecture)
#
# This file is MEASURED: dstack folds its exact text into the CVM's
# compose_hash (RTMR3 / mr_config_id), which the /proof page verifies against
# the published reference. Therefore:
#   * every image is pinned by DIGEST — a floating tag would make the
#     measurement meaningless (the same compose_hash could run different code);
#   * secrets are NOT in this file — they arrive via the sealed env
#     (`phala deploy -e sub2api.env`), which does not affect compose_hash.
#
# Digest conventions:
#   * markerdao/* (our images): pin the linux/amd64 CHILD manifest digest;
#     cosign signs the multi-arch INDEX (see docs/attestation-verification.md).
#     The all-zero digests below are deploy guards — replace them with the
#     digests printed by the publish-tee-images CI run before deploying.
#   * library images (postgres/redis): pin the multi-arch INDEX digest, as
#     printed by `docker buildx imagetools inspect <tag>`.
# =============================================================================

services:
  sub2api:
    # Built from THIS repo by .github/workflows/publish-tee-images.yml (cosign
    # keyless + SLSA provenance, tag proof-v15). amd64 child of INDEX
    # sha256:44d10d34b2efbb68b3dcfa9747d3e8be851f78c28a3927085cb5bda090e7f6ac.
    image: docker.io/markerdao/sub2api@sha256:2e618ed930a560cb4c5ac46aab23746ffbaae06cf69b198e47fa12d0b514e7cd
    container_name: sub2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    volumes:
      - sub2api_data:/app/data
      # dstack guest-agent socket — the E2EE inference path derives its
      # enclave key (GetKey e2ee/v1) over it, same key as the attestor binds
      # into the quote. (A unix socket needs r/w, so NOT :ro.)
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - ENABLE_SERVER_TIMING=${ENABLE_SERVER_TIMING:-false}
      - RUN_MODE=${RUN_MODE:-standard}
      - UPDATE_GITHUB_TOKEN=${UPDATE_GITHUB_TOKEN:-}
      # Database (PostgreSQL)
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}
      # Admin (auto-created on first run)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # JWT
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      # Setup
      - SETUP_MIGRATION_TIMEOUT_SECONDS=${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}
      # TOTP (2FA)
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      # Timezone
      - TZ=${TZ:-Asia/Shanghai}
      # Gemini OAuth (optional)
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_USER_AGENT_VERSION=${ANTIGRAVITY_USER_AGENT_VERSION:-}
      # Security (URL allowlist)
      - SECURITY_URL_ALLOWLIST_ENABLED=${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      # Update
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
      # Image generation stream & concurrency
      - GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT=${GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT:-0}
      - GATEWAY_OPENAI_HTTP2_ENABLED=${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
      - GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1=${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD=${GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD:-2}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS:-600}
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Attestation sidecar: serves a FRESH, nonce-bound Intel TDX DCAP quote +
  # dstack event log with permissive CORS, so any browser can hardware-verify
  # THIS CVM. Carries no secrets and no request/response content.
  # Public endpoint: https://<app-id>-8091.<node>.phala.network/attestation/quote
  attestor:
    # Built from deploy/attestor/ by publish-tee-images.yml (tag proof-v15).
    # amd64 child of INDEX sha256:696a563488336158fbc6e852fcdbad4a9c81115fd9e1fe315d4aac8adc5ce535.
    image: docker.io/markerdao/sub2api-attestor@sha256:1d0d53b001e676cdd27b96b9974245dc72486964fede5febb70b5fefc2d3b636
    container_name: sub2api-attestor
    restart: unless-stopped
    ports:
      - "8091:8091"
    volumes:
      # dstack guest-agent socket — the sidecar calls GetQuote over it.
      # (A unix socket needs r/w, so NOT :ro.)
      - /var/run/dstack.sock:/var/run/dstack.sock

  # Custom-domain ingress: TLS terminates INSIDE this CVM.
  # Gives users a clean base URL (https://api.apex1.us) that resolves straight to
  # this attested enclave. dstack-ingress uses the Cloudflare token to write the
  # CNAME/TXT/CAA records itself, obtains a Let's Encrypt cert via DNS-01, listens
  # on :443, and forwards plaintext to sub2api:8080 OVER THE COMPOSE NETWORK — so
  # the plaintext prompt never leaves this TEE CVM. The direct
  # <app-id>-8080.<node>.phala.network endpoint keeps working alongside this.
  #
  # The CAA record it writes pins issuance to the Let's Encrypt ACCOUNT that lives
  # inside this enclave: nobody — including the operator — can obtain a public cert
  # for these names outside the CVM. That guarantee is part of the /proof story.
  #
  # Only dstack.sock is mounted: entrypoint.sh prefers it and falls back to the
  # legacy tappd.sock only when absent (dstack 0.5.9 provides dstack.sock).
  dstack-ingress:
    image: docker.io/dstacktee/dstack-ingress:2.2@sha256:d05a7b343c37c1cca1bba8dbf7e8f3c6d2118158af2d41c455103796db4f67f0
    container_name: sub2api-ingress
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # DOMAINS drives CERTIFICATE acquisition only. Routing comes from
      # ROUTING_MAP: entrypoint.sh writes haproxy.cfg only when ROUTING_MAP is
      # set, or when the SINGULAR $DOMAIN is set — with DOMAINS alone neither
      # branch fires, no haproxy.cfg is produced and the container crash-loops.
      # Both lists accept comma separation (they are `tr ',' '\n'`-normalised).
      - DOMAINS=apex1.us,api.apex1.us
      - ROUTING_MAP=apex1.us=sub2api:8080,api.apex1.us=sub2api:8080
      - TARGET_ENDPOINT=sub2api:8080
      - GATEWAY_DOMAIN=_.dstack-pha-prod5.phala.network
      - DNS_PROVIDER=cloudflare
      - SET_CAA=true
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:?set CERTBOT_EMAIL (Let's Encrypt expiry notifications)}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN (Cloudflare Edit-zone-DNS token) via sealed env}
    volumes:
      # dstack guest-agent socket — used to read this CVM's app_id for the
      # _dstack-app-address TXT record and to fetch the domain-attestation quote.
      - /var/run/dstack.sock:/var/run/dstack.sock
      - ingress_certs:/etc/letsencrypt
      - ingress_evidences:/evidences
    depends_on:
      - sub2api
    networks:
      - sub2api-network

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: sub2api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    container_name: sub2api-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - redis_data:/data
    command: >
      sh -c '
        redis-server \
        --save 60 1 \
        --appendonly yes \
        --appendfsync everysec \
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  sub2api_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # dstack-ingress Let's Encrypt account + certs (must persist across restarts,
  # otherwise every restart registers a new ACME account and the CAA accounturi
  # pin breaks).
  ingress_certs:
    driver: local
  # dstack-ingress domain-attestation evidence bundle.
  ingress_evidences:
    driver: local

networks:
  sub2api-network:
    driver: bridge
