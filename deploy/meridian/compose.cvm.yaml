# dstack compose for a STANDALONE Meridian seat as its own attested CVM (enclave B).
#
# This is the PRODUCTION isolation of the Claude-subscription bridge: each
# subscription account runs as its own Phala CVM (enclave B). The gateway
# (enclave A, deploy/gateway/compose.enclave.yaml) then registers this as an
# `openai-compatible` upstream over the network via PUT /v1/admin/upstreams.
# Benefits: the gateway keeps a STABLE attested identity (adding/rotating
# seats never changes the gateway's compose_hash), seats hot-load via the gateway's
# PUT /v1/admin/upstreams, and gateway<->meridian faults are isolated.
#
# TRADEOFF vs co-locate: the gateway->meridian hop now crosses the network and carries
# PLAINTEXT prompt/response. It is protected by (a) Phala ingress TLS on the public
# endpoint and (b) a mandatory MERIDIAN_API_KEY the gateway must present as a bearer
# token. Anthropic still sees the subscription traffic in cleartext (non-confidential
# route, see production-deployment.md §8/§10) — that is inherent to subscription routing.
#
# Deploy (its OWN CVM, separate from the gateway):
#   cd deploy/meridian
#   phala deploy -n meridian-seat1 -c compose.cvm.yaml -e <sealed.env>
# where <sealed.env> sets MERIDIAN_API_KEY, MERIDIAN_SEAT1_CREDENTIALS,
# MERIDIAN_SEAT1_CLAUDE_JSON, and (optional) MERIDIAN_SEAT1_PROXY.
#
# After boot, take the CVM's public :3456 endpoint and register it on the gateway:
#   curl -X PUT https://<gateway>/v1/admin/upstreams -H "Authorization: Bearer <ADMIN_TOKEN>" \
#     -d '[{"name":"meridian-seat1","provider":"openai-compatible",
#          "base_url":"https://<meridian-app-id>-3456.<node>.phala.network",
#          "path":"/v1/messages",
#          "models":{"claude-opus-4-8":"claude-opus-4-8","claude-sonnet-5":"claude-sonnet-5","claude-haiku-4-5":"claude-haiku-4-5","claude-fable-5":"claude-fable-5","claude-opus-4-7":"claude-opus-4-7","claude-opus-4-6":"claude-opus-4-6","claude-sonnet-4-6":"claude-sonnet-4-6"},
#          "bearer_token":"<same MERIDIAN_API_KEY>"}]'

services:
  meridian-seat1:
    # Built from deploy/meridian/ and pushed to docker.io/markerdao. Pin by DIGEST
    # so it is measured into this CVM's compose_hash (enclave B's attested identity).
    image: docker.io/markerdao/meridian-enclave@sha256:9d0bdeed86187726c00afcf407430c592be83286e70eb3fc2e6ff7ae6326fc6a
    ports:
      # Exposed so Phala's ingress gives it a public HTTPS endpoint the gateway can reach.
      - "3456:3456"
    environment:
      MERIDIAN_HOST: "0.0.0.0"
      MERIDIAN_PORT: "3456"
      NO_PROXY: "127.0.0.1,localhost"
      # Silence the bundled @anthropic-ai/claude-code SDK's own telemetry so the
      # ONLY egress from this enclave is the necessary api.anthropic.com call.
      # (Its telemetry — Statsig flags + Datadog logs + error reporting — otherwise
      # phones home to Anthropic infra; harmless for this non-confidential route but
      # it muddies the "enclave only talks to the model" audit story and rides the
      # ProxyLite egress.) Umbrella flag + two specific ones as belt-and-suspenders.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      # MANDATORY on a public endpoint: turns on Meridian's requireAuth middleware
      # (x-api-key or Authorization: Bearer, constant-time compared). Without this,
      # anyone hitting the public :3456 endpoint could spend the Claude subscription.
      # The gateway upstream's bearer_token MUST equal this value.
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:?set MERIDIAN_API_KEY (strong random) via dstack sealed env; gateway upstream bearer_token must match}
      # Anti-ban static egress (residential SOCKS5). Verified working: egress to
      # api.anthropic.com flows through gost->ProxyLite (exit IP 206.206.91.173).
      PROXYLITE_SOCKS5: ${MERIDIAN_SEAT1_PROXY:-}
      # OAuth subscription state (file CONTENTS) via dstack sealed env; entrypoint.sh
      # materializes them to a WRITABLE path so the ~8h token refresh persists.
      CLAUDE_CREDENTIALS_JSON: ${MERIDIAN_SEAT1_CREDENTIALS:?set MERIDIAN_SEAT1_CREDENTIALS (contents of secrets/seat1/.credentials.json) via dstack sealed env}
      CLAUDE_JSON: ${MERIDIAN_SEAT1_CLAUDE_JSON:?set MERIDIAN_SEAT1_CLAUDE_JSON (contents of secrets/seat1/.claude.json) via dstack sealed env}
    volumes:
      # PERSIST the OAuth credentials across restarts. Meridian refreshes the ~8h
      # token and writes it to /root/.claude/.credentials.json; on a dstack CVM this
      # named volume maps to TEE-encrypted persistent storage, so the refreshed token
      # survives restarts/redeploys. entrypoint.sh then keeps the persisted copy when
      # it is >= the env-injected one (newest wins), so a restart no longer reverts to
      # a possibly-rotated env copy. Without this, every restart re-materializes the
      # (immutable, possibly-stale) sealed-env creds and refresh can 401.
      - meridian-claude:/root/.claude
    restart: unless-stopped

  # Attestation sidecar (enclave B's PUBLIC hardware-verification surface).
  # Serves a fresh, nonce-bound Intel TDX DCAP quote + dstack event log over CORS
  # at GET /attestation/quote?nonce=<hex> so a browser can hardware-verify THIS
  # CVM the same way it verifies the gateway. Meridian (:3456) has no attestation
  # endpoint and dstack's public :8090 Info page exposes measurements but NO quote
  # and NO CORS — hence this sidecar. It carries NO secrets and NO prompt/response
  # content (only the public quote + measurement event log), so it needs no auth
  # and no sealed env — keep it OUT of the sealed-env discipline entirely.
  # Built from deploy/meridian/attestor/ and pushed to docker.io/markerdao. Pin by
  # DIGEST so it is measured into this CVM's compose_hash (enclave B's identity).
  meridian-attestor:
    image: docker.io/markerdao/meridian-attestor@sha256:7e6d51fe173a2762773a9a80a63ff5eee0303a060bc12551bc1fcb30f25056a1
    ports:
      # Public endpoint: https://<app-id>-8091.<node>.phala.network/attestation/quote
      - "8091:8091"
    volumes:
      # dstack 0.5.9 guest-agent socket — the sidecar calls GetQuote over it.
      # (Same mount the gateway uses; a unix socket needs r/w, so NOT :ro.)
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: unless-stopped

volumes:
  meridian-claude:
